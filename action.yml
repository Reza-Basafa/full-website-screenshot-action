name: "Screenshot Action"
description: "Capture a full-page screenshot of a website using Puppeteer"
inputs:
  url:
    description: "Public website URL to capture (include https://)"
    required: true
  destination:
    description: "Output screenshot path"
    required: false
    default: "./screenshot.png"
branding:
  icon: "camera"
  color: "orange"
runs:
  using: "composite"
  steps:
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install capture-website-cli
      shell: bash
      run: npm install --global capture-website-cli
    - name: Capture full-page screenshot
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
        DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        node -e 'const u = new URL(process.env.TARGET_URL); if (!["http:", "https:"].includes(u.protocol)) { console.error("URL must use http:// or https://"); process.exit(1); }'
        capture-website "$TARGET_URL" --output "$DESTINATION" --full-page
        echo "Screenshot saved to: $DESTINATION"
